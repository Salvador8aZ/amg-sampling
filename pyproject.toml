[project]
name = "amg_sampling"
version = "0.1.0.dev0"
description = "Exact enumeration and sampling of aberration multigraph (AMG) rejoin configurations."
authors = [{ name = "Salvador8aZ" }]
license = "MIT"
readme = "README.md"
# Upper bound <3.14: hydra-core 1.3.x fails at startup on Python 3.14 (argparse
# rejects its lazy --shell-completion help). Widen to <4.0 once a Hydra release
# supports 3.14. An upper bound is needed anyway: Poetry cannot resolve
# dependencies that cap themselves at <4.0 against an unbounded range.
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The mathematical core (core, exact, samplers, data, analysis) is pure Python.
# hydra-core and omegaconf are used only by the command-line application
# (amg_sampling.app).
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.scripts]
amg-sampling = "amg_sampling.cli:main"

[project.optional-dependencies]
# Figures are skipped (with a message) when matplotlib is not installed.
# matplotlib is imported only by amg_sampling.analysis.plots.
plots = ["matplotlib>=3.8"]

[tool.poetry]
packages = [{ include = "amg_sampling" }]
# Non-package paths reach the SOURCE DISTRIBUTION only. Poetry does not copy
# files from outside the package directory into a wheel, so data/ and README.md
# ship in the sdist and nowhere else. Anything that must be importable from an
# installed wheel has to live inside amg_sampling/ (see directories.package_data).
include = ["data/*", "README.md"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
coverage = "^7.16.0"
ruff = "^0.16.7"
vulture = "^2.16"
deptry = "^0.25.1"
hypothesis = "^6.168.1"
# Used only as an independent reference implementation in tests.
networkx = "^3.6"
# Lets the figure tests run; consumers get it through the `plots` extra.
matplotlib = "^3.11.2"

# Optional: NOT installed by a plain `poetry install`.
# Use `poetry install --with notebook` when you need it.
[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
jupyter = "^1.1.1"
jupyterlab = "^4.6.3"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (includes E402 import placement, F401 unused
# imports). I: import sorting. UP: pyupgrade. ERA001: commented-out code.
# ARG is deliberately NOT enabled -- unused arguments are usually signature
# contracts in interface implementations, not dead code.
select = ["E", "F", "I", "UP", "ERA001"]
# E741: `l` is the paper's notation for a cycle length (C_l) and is kept so the
# code reads like the theory notes.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F841"]
# A vulture baseline is a list of bare names, so every line is an undefined
# reference. See `make deadcode` for when this file exists.
"deadcode-whitelist.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["amg_sampling/tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: exhaustive checks that take more than a few seconds",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.deptry]
# The shipped test suite imports pytest, hypothesis and networkx, which are
# correctly dev dependencies.
[tool.deptry.per_rule_ignores]
DEP004 = ["pytest", "hypothesis", "networkx"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
