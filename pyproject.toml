[project]
name = "amg-sampling"
version = "0.1.0.dev0"
description = "Exact enumeration and sampling of aberration multigraph (AMG) rejoin configurations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Salvador8aZ" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The mathematical core (core, exact, samplers, data, analysis) is pure Python.
# hydra-core is used only by the command-line application (amg_sampling.app).
dependencies = [
    "hydra-core>=1.3",
]

[project.scripts]
amg-sampling = "amg_sampling.cli:main"

[project.optional-dependencies]
# Figures are skipped (with a message) when matplotlib is not installed.
plots = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    # Used only as an independent reference implementation in tests.
    "networkx>=3",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amg_sampling"]

[tool.pytest.ini_options]
testpaths = ["amg_sampling/tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: exhaustive checks that take more than a few seconds",
]
