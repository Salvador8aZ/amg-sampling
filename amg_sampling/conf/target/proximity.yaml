# Proximity-weighted rejoining (docs/theory/mcmc.md §5). Needs problem=patient
# (breakpoint positions) and sampler=mcmc.
#   w(rejoin) = (distance / scale_bp) ** -alpha  for ends on one chromosome
#             = exp(inter_log_weight)            for ends on different chromosomes
# alpha = 0 and inter_log_weight = 0 is the uniform target. Both can be fitted
# to the Baca et al. junctions with scripts/biological_toy.py.
name: proximity
alpha: 1.0
scale_bp: 1000000       # an inter-chromosomal rejoin weighs as much as an intra one this far apart
min_distance_bp: 1000   # distances below this are treated as this
inter_log_weight: 0.0   # 0: an inter-chromosomal rejoin weighs as much as an intra one scale_bp apart
