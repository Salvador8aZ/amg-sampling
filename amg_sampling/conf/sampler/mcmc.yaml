# Markov chain Monte Carlo with 2-switch (reversal) moves (docs/theory/mcmc.md).
# The chain starts from one exact uniform draw of the rejection sampler.
name: mcmc
num_samples: 100000
burn_in: 10000                    # steps discarded before the first sample
thin: 10                          # steps between recorded samples
max_proposals_per_sample: 1000000 # for the rejection-sampled starting state
